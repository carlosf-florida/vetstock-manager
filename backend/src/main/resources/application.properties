spring.application.name=vet

# ---------------------------------------------------------------
# Base de datos MySQL.
# Credenciales de PRUEBA: se pueden sobrescribir con variables de
# entorno (DB_URL, DB_USER, DB_PASSWORD) sin tocar este archivo.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetstock?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Las tablas se crean con database/migrations/001_esquema_inicial.sql, Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
# Consultas SQL en consola desactivadas (activar solo para depurar)
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Subida de documentos (el límite de negocio es 10 MB y se valida en el backend)
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

server.port=8080

# ---------------------------------------------------------------
# Pagos (ADAPTADOR SIMULADO, entorno de pruebas).
# Token que debe traer la "notificación del proveedor" (webhook).
# En producción iría en una variable de entorno y sería el secreto
# real del proveedor contratado (por ejemplo Redsys).
# ---------------------------------------------------------------
vetstock.pagos.token-notificacion=${PAGOS_TOKEN_NOTIFICACION:token-simulado-demo}
vetstock.pagos.simulado-activo=${PAGOS_SIMULADO_ACTIVO:true}

# ---------------------------------------------------------------
# Integración con el ERP Odoo (segundo adaptador).
#   modo=SIMULADO -> adaptador simulado, sin servidor Odoo (por defecto)
#   modo=REAL     -> JSON-RPC contra un servidor Odoo real:
#                    crea product.template, res.partner y sale.order
# Credenciales fuera del código: usar variables de entorno en producción.
# ---------------------------------------------------------------
vetstock.odoo.modo=${ODOO_MODO:SIMULADO}
vetstock.odoo.url=${ODOO_URL:http://localhost:8069}
vetstock.odoo.db=${ODOO_DB:vetstock_erp}
vetstock.odoo.usuario=${ODOO_USUARIO:admin}
vetstock.odoo.clave=${ODOO_CLAVE:admin}
