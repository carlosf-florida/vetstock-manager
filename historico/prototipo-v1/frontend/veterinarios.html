<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinarios - VetStock Manager</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="cabecera" id="cabecera"></header>
    <div id="mensajes" class="mensajes"></div>
    <main class="contenedor">
        <div class="barra-superior">
            <h1>Veterinarios (clientes)</h1>
            <button class="btn btn-principal" id="btnNuevo">+ Nuevo veterinario</button>
        </div>

        <div class="tarjeta oculto" id="bloqueFormulario">
            <h2>Nuevo veterinario</h2>
            <form id="formVeterinario" class="formulario">
                <div class="campo"><label for="nombreCompleto">Nombre completo *</label><input id="nombreCompleto" maxlength="100" required></div>
                <div class="campo"><label for="clinica">Clínica *</label><input id="clinica" maxlength="100" required></div>
                <div class="campo"><label for="numeroColegiado">Nº de colegiado *</label><input id="numeroColegiado" maxlength="20" required></div>
                <div class="campo"><label for="telefono">Teléfono</label><input id="telefono" maxlength="20"></div>
                <div class="campo ancho"><label for="direccion">Dirección</label><input id="direccion" maxlength="150"></div>
                <div class="campo"><label for="username">Usuario de acceso *</label><input id="username" minlength="3" maxlength="50" required autocomplete="off"></div>
                <div class="campo"><label for="password">Contraseña *</label><input id="password" type="password" minlength="6" maxlength="50" required autocomplete="new-password"></div>
                <div class="acciones">
                    <button class="btn btn-principal" type="submit">Guardar</button>
                    <button class="btn" type="button" id="btnCancelar">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="tarjeta">
            <div class="fila">
                <div class="campo filtro"><label for="filtroBuscar">Buscar</label><input id="filtroBuscar" placeholder="Nombre o clínica"></div>
            </div>
        </div>

        <div class="tarjeta"><div class="tabla-scroll" id="tablaVeterinarios"></div></div>
    </main>
    <script src="js/comun.js"></script>
    <script src="js/veterinarios.js"></script>
</body>
</html>
