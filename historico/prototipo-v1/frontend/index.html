<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - VetStock Manager</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="mensajes" class="mensajes"></div>
    <main class="contenedor login">
        <h1>🐾 VetStock Manager</h1>
        <div class="tarjeta">
            <h2>Iniciar sesión</h2>
            <form id="formLogin" class="formulario" style="grid-template-columns: 1fr;">
                <div class="campo">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" required autocomplete="username">
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button class="btn btn-principal" type="submit">Entrar</button>
            </form>
            <p class="nota">Usuarios de prueba: admin / admin123 (almacén) · dr.garcia / vet123 (veterinario)</p>
        </div>
    </main>
    <script src="js/comun.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
